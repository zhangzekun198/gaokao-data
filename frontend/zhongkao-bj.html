<!DOCTYPE html>
<html lang="zh-CN">

<meta charset="UTF-8">

<title>北京中考 · 区排定位 · 中高考考情分析平台</title>
<style>
  :root{--bg:#eef1f6;--card:#fff;--ink:#1f2430;--sub:#6b7280;--line:#e6e8ec;
    --accent:#3b5bdb;--accent2:#0e7490;--warn:#b45309;--warnbg:#fff7ed;
    --chong:#dc2626;--wen:#2563eb;--bao:#15803d;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",Roboto,Arial,sans-serif;font-size:15px;line-height:1.6}
  header.top{background:linear-gradient(135deg,#1e2a78,#3b5bdb 55%,#0e7490);color:#fff;padding:24px 18px}
  header.top .bar{max-width:960px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  header.top h1{margin:0;font-size:22px;letter-spacing:.5px}
  header.top a{color:#fff;text-decoration:none;font-size:14px;opacity:.92}
  .wrap{max-width:960px;margin:0 auto;padding:18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 2px 10px rgba(0,0,0,.04)}
  h2.sec{margin:0 0 6px;font-size:18px}
  .hint{color:var(--sub);font-size:13.5px;margin:0 0 12px}
  .note{background:var(--warnbg);border:1px solid #fed7aa;border-radius:12px;padding:12px 14px;font-size:13px;color:var(--warn);margin-bottom:16px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
  .row>div{display:flex;flex-direction:column;gap:4px;flex:1 1 150px}
  label{font-size:12.5px;color:var(--sub)}
  input,select{padding:9px 10px;border:1px solid var(--line);border-radius:9px;font-size:14px;font-family:inherit;background:#fff;color:var(--ink)}
  .btn{cursor:pointer;background:var(--accent);color:#fff;border:none;border-radius:9px;padding:10px 16px;font-size:14px;font-weight:600;font-family:inherit}
  .btn.ghost{background:#eef1f6;color:var(--ink);font-weight:500}
  .pill{display:inline-block;font-size:11px;padding:1px 8px;border-radius:12px;background:#eef1f6;color:var(--sub)}
  .pill.g{background:#e8f5ee;color:var(--bao)}
  .grp{margin-top:14px}
  .grp h3{margin:0 0 8px;font-size:15px;font-weight:700}
  .grp.chong h3{color:var(--chong)} .grp.wen h3{color:var(--wen)} .grp.bao h3{color:var(--bao)}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{padding:8px 10px;text-align:left;border-bottom:1px solid #f0f2f4}
  th{background:#fafbfc;color:var(--sub);font-weight:600;font-size:13px}
  td.rank{text-align:right;font-variant-numeric:tabular-nums}
  tbody tr:hover{background:#fcfcfd}
  .empty{color:var(--sub);font-size:13.5px;padding:6px 0}
  .foot{text-align:center;color:var(--sub);font-size:12px;margin:22px 0 10px}
  @media(max-width:576px){ .row>div{flex:1 1 100%} header.top h1{font-size:19px} }
</style>
</head>
<body>
<header class="top"><div class="bar">
  <h1>北京中考 · 区排定位</h1>
  <a href="index.html">← 平台首页</a>
</div></header>

<div class="wrap">
  <div class="note">
    <b>数据口径：</b>本页为「<b>区内排名 → 目标高中</b>」对照，覆盖 <b>东城 / 西城 / 朝阳 / 丰台 / 海淀</b> 五区共 <b id="totSch">—</b> 所学校。区排名为<b>手动读取官方图片后整理的预估值</b>，用于志愿匹配参考；实际录取以当年官方发布为准。
  </div>

  <div class="card">
    <h2 class="sec">区排测算</h2>
    <div class="hint">选择所在区并填入孩子的<b>区内排名</b>（越小越靠前），按冲 / 稳 / 保给出目标高中。</div>
    <div class="row">
      <div><label>所在区</label><select id="dist"></select></div>
      <div><label>区内排名</label><input id="rank" type="number" placeholder="如 800"></div>
      <div style="flex:0 0 auto"><button class="btn" onclick="calc()">测算</button></div>
      <div style="flex:0 0 auto"><button class="btn ghost" onclick="showAll()">查看本区全部</button></div>
    </div>
    <div id="out" style="margin-top:14px"></div>
  </div>

  <div class="card">
    <h2 class="sec">各区覆盖</h2>
    <div id="cover"></div>
  </div>

  <div class="foot">北京中考区排定位 · 中高考考情分析平台 · 数据仅供参考，请以官方发布为准</div>
</div>

const $=id=>document.getElementById(id);
const esc=s=>(s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

(function init(){
  const ds=Object.keys(D.data);
  $('dist').innerHTML=ds.map(d=>'<option>'+esc(d)+'</option>').join('');
  $('totSch').textContent=D.summary.total_schools;
  $('cover').innerHTML='<table><thead><tr><th>区</th><th style="text-align:right">学校数</th></tr></thead><tbody>'+
    ds.map(d=>'<tr><td>'+esc(d)+'</td><td class="rank">'+D.data[d].length+'</td></tr>').join('')+
    '</tbody></table>';
})();

function listOf(d){ return (D.data[d]||[]).slice().sort((a,b)=>a.district_rank_estimate-b.district_rank_estimate); }

function calc(){
  const d=$('dist').value, r=parseInt($('rank').value,10);
  const out=$('out');
  if(!r||r<=0){ out.innerHTML='<div class="hint">请填写有效的区内排名。</div>'; return; }
  const all=listOf(d);
  // 数据稀疏（每区仅 22–56 所，区排跨度大），按"位置"分档而非固定比例，避免空档
  let idx=all.findIndex(x=>x.district_rank_estimate>=r);
  if(idx<0) idx=all.length;
  const N=5;
  const chong=all.slice(Math.max(0,idx-N), idx);   // 要求比你更靠前 → 冲
  const wen  =all.slice(idx, idx+N);                // 要求与你接近/略宽松 → 稳
  const bao  =all.slice(idx+N, idx+2*N);            // 要求明显宽松 → 保
  const tbl=(arr,cls,title,tip)=>
    '<div class="grp '+cls+'"><h3>'+title+'（'+arr.length+'）</h3>'+
    (arr.length?'<table><thead><tr><th>学校</th><th style="text-align:right">预估区排</th></tr></thead><tbody>'+
      arr.map(x=>'<tr><td>'+esc(x.school)+'</td><td class="rank">'+x.district_rank_estimate.toLocaleString()+'</td></tr>').join('')+
    '</tbody></table>':'<div class="empty">'+tip+'</div>')+'</div>';
  out.innerHTML='<div class="hint">'+esc(d)+' · 区内排名 <b>'+r.toLocaleString()+'</b> · 本区共 '+all.length+' 所</div>'+
    tbl(chong,'chong','冲','本区暂无处于冲刺区间的高中')+
    tbl(wen,'wen','稳','本区暂无处于稳妥区间的高中')+
    tbl(bao,'bao','保','本区暂无处于保底区间的高中');
}

function showAll(){
  const d=$('dist').value, all=listOf(d);
  $('out').innerHTML='<div class="grp"><h3>'+esc(d)+' · 全部 '+all.length+' 所（按预估区排升序）</h3>'+
    '<table><thead><tr><th>学校</th><th style="text-align:right">预估区排</th></tr></thead><tbody>'+
    all.map(x=>'<tr><td>'+esc(x.school)+'</td><td class="rank">'+x.district_rank_estimate.toLocaleString()+'</td></tr>').join('')+
    '</tbody></table></div>';
}
</script>
