<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>资料库 · 中高考考情分析平台</title>
<style>
  :root{--bg:#eef1f6;--card:#fff;--ink:#1f2430;--sub:#6b7280;--line:#e6e8ec;
    --accent:#3b5bdb;--accent2:#0e7490;--warn:#b45309;--warnbg:#fff7ed;
    --chong:#dc2626;--bao:#15803d;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",Roboto,Arial,sans-serif;font-size:15px;line-height:1.6}
  header.top{background:linear-gradient(135deg,#1e2a78,#3b5bdb 55%,#0e7490);color:#fff;padding:24px 18px}
  header.top .bar{max-width:1060px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  header.top h1{margin:0;font-size:22px;letter-spacing:.5px}
  header.top a{color:#fff;text-decoration:none;font-size:14px;opacity:.92}
  .wrap{max-width:1060px;margin:0 auto;padding:18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 2px 10px rgba(0,0,0,.04)}
  h2.sec{margin:0 0 6px;font-size:18px}
  .hint{color:var(--sub);font-size:13.5px;margin:0 0 12px}
  .note{background:var(--warnbg);border:1px solid #fed7aa;border-radius:12px;padding:12px 14px;font-size:13px;color:var(--warn);margin-bottom:16px}
  .tabnav{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .tabbtn{cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--sub);
    border-radius:9px;padding:8px 14px;font-size:13.5px;font-family:inherit}
  .tabbtn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
  .row>div{display:flex;flex-direction:column;gap:4px;flex:1 1 150px}
  label{font-size:12.5px;color:var(--sub)}
  input,select{padding:9px 10px;border:1px solid var(--line);border-radius:9px;font-size:14px;font-family:inherit;background:#fff;color:var(--ink)}
  .btn{cursor:pointer;background:var(--accent);color:#fff;border:none;border-radius:9px;padding:10px 16px;font-size:14px;font-weight:600;font-family:inherit}
  .btn:disabled{opacity:.55;cursor:not-allowed}
  .status{font-size:13px;color:var(--sub);margin-top:10px}
  .status.err{color:var(--chong)} .status.ok{color:var(--bao)}
  .item{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:#fafbfc;margin-bottom:10px}
  .item .t{font-weight:700;font-size:15.5px;margin-bottom:3px}
  .item .m{color:var(--sub);font-size:12.5px;margin-top:2px}
  .pill{display:inline-block;font-size:11px;padding:1px 7px;border-radius:12px;background:#eef1f6;color:var(--sub);margin-right:4px}
  .pill.g{background:#e8f5ee;color:var(--bao)} .pill.b{background:#eef1fb;color:var(--accent)} .pill.o{background:#fdf3e7;color:var(--warn)}
  table{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:6px}
  th,td{padding:7px 9px;text-align:left;border-bottom:1px solid #f0f2f4}
  th{background:#fafbfc;color:var(--sub);font-weight:600;font-size:12.5px}
  td.num{text-align:right;font-variant-numeric:tabular-nums}
  tbody tr:hover{background:#fcfcfd}
  .grp{margin-top:14px}
  .grp h3{margin:0 0 6px;font-size:15px;font-weight:700}
  .grp.chong h3{color:var(--chong)} .grp.wen h3{color:#2563eb} .grp.bao h3{color:var(--bao)}
  .foot{text-align:center;color:var(--sub);font-size:12px;margin:22px 0 10px}
  @media(max-width:576px){ .row>div{flex:1 1 100%} header.top h1{font-size:19px} }
</style>
</head>
<body>
<header class="top"><div class="bar">
  <h1>资料库</h1>
  <a href="index.html">← 平台首页</a>
</div></header>

<div class="wrap">
  <div class="note">
    <b>资料库</b>＝查询类资料汇总。高考院校 / 专业库数据较大，<b>按需从 CDN 加载</b>；中考各地区的学校与专业资料已内联，离线可用。原中考页的「探校」「探专业」已迁移至此，填报主流程只保留定位、推荐、志愿表与体检。
  </div>

  <div class="card">
    <h2 class="sec">资料检索</h2>
    <div class="tabnav">
      <button class="tabbtn on" id="tSch" onclick="switchKB('sch')">院校库（高考）</button>
      <button class="tabbtn" id="tMajor" onclick="switchKB('major')">专业库（高考）</button>
      <button class="tabbtn" id="tZkSch" onclick="switchKB('zksch')">中考 · 学校</button>
      <button class="tabbtn" id="tZkMaj" onclick="switchKB('zkmaj')">中考 · 专业</button>
    </div>

    <!-- 院校库 -->
    <div id="kb-sch">
      <div class="row">
        <div><label>校名关键字</label><input id="sKw" placeholder="如 北京 / 师范 / 科技"></div>
        <div><label>省份</label><select id="sProv"><option value="">全部</option></select></div>
        <div><label>类型</label><select id="sType"><option value="">全部</option></select></div>
        <div style="flex:0 0 auto"><button class="btn" id="sBtn" onclick="loadSchools()">加载院校库</button></div>
      </div>
      <div class="status" id="sStat">未加载。点击「加载院校库」从 CDN 拉取（约 13.9 MB，需数十秒）。</div>
      <div id="sOut" style="margin-top:12px"></div>
    </div>

    <!-- 专业库 -->
    <div id="kb-major" style="display:none">
      <div class="row">
        <div><label>专业名关键字</label><input id="mKw" placeholder="如 计算机 / 金融 / 临床"></div>
        <div><label>门类</label><select id="mMenlei"><option value="">全部</option></select></div>
        <div><label>专业类</label><select id="mClass"><option value="">全部</option></select></div>
        <div style="flex:0 0 auto"><button class="btn" id="mBtn" onclick="loadMajors()">加载专业库</button></div>
      </div>
      <div class="status" id="mStat">未加载。点击「加载专业库」从 CDN 拉取（约 6.5 MB）。</div>
      <div id="mOut" style="margin-top:12px"></div>
    </div>

    <!-- 中考 · 学校 -->
    <div id="kb-zksch" style="display:none">
      <div class="row">
        <div><label>地区</label><select id="zkArea" onchange="renderZkSch()">
          <option value="sh">上海中考</option><option value="gz">广州中考</option><option value="bj">北京中考</option>
        </select></div>
        <div><label>关键字（校名 / 区）</label><input id="zkKw" placeholder="如 大同 / 海淀" oninput="renderZkSch()"></div>
      </div>
      <div class="status" id="zkStat"></div>
      <div id="zkSchOut" style="margin-top:12px"></div>
    </div>

    <!-- 中考 · 专业 -->
    <div id="kb-zkmaj" style="display:none">
      <div class="row">
        <div><label>地区</label><select id="zkArea2" onchange="renderZkMaj()">
          <option value="sh">上海 · 中本贯通</option><option value="gz">广州 · 贯通 / 中职专业</option>
        </select></div>
        <div><label>关键字（专业 / 校 / 对接本科）</label><input id="zkMajKw" placeholder="如 信息安全 / 电力" oninput="renderZkMaj()"></div>
      </div>
      <div class="status" id="zkMajStat"></div>
      <div id="zkMajOut" style="margin-top:12px"></div>
    </div>
  </div>

  <div class="foot">资料库 · 中高考考情分析平台 · 中考资料内联离线可用，高考库按需 CDN 加载</div>
</div>

const CDN='https://cdn.jsdelivr.net/gh/zhangzekun198/gaokao-data@main/data/';

const $=id=>document.getElementById(id);
const esc=s=>(s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(v);return (v===null||v===undefined||v==='--'||v===''||isNaN(n))?null:n;};

function switchKB(k){
  const map={sch:'kb-sch',major:'kb-major',zksch:'kb-zksch',zkmaj:'kb-zkmaj'};
  for(const key in map) $(map[key]).style.display = (key===k)?'':'none';
  $('tSch').classList.toggle('on',k==='sch');
  $('tMajor').classList.toggle('on',k==='major');
  $('tZkSch').classList.toggle('on',k==='zksch');
  $('tZkMaj').classList.toggle('on',k==='zkmaj');
  if(k==='zksch' && !$('zkSchOut').innerHTML) renderZkSch();
  if(k==='zkmaj' && !$('zkMajOut').innerHTML) renderZkMaj();
}

async function fetchGz(file){
  const res=await fetch(CDN+file);
  if(!res.ok) throw new Error('CDN 返回 HTTP '+res.status);
  const buf=await res.arrayBuffer();
  const ds=new DecompressionStream('gzip');
  const txt=await new Response(new Blob([buf]).stream().pipeThrough(ds)).text();
  return JSON.parse(txt);
}

async function loadSchools(){
  if(S.list){ renderSchools(); return; }
  const b=$('sBtn'), st=$('sStat');
  b.disabled=true; st.className='status'; st.textContent='正在从 CDN 下载院校库（13.9 MB）…';
  try{
    const d=await fetchGz('schools.json.gz');
    S.list=d.schools||[];
    const provs=[...new Set(S.list.map(x=>x.province).filter(Boolean))].sort();
    $('sProv').innerHTML='<option value="">全部</option>'+provs.map(p=>'<option>'+esc(p)+'</option>').join('');
    const types=[...new Set(S.list.map(x=>x.type).filter(Boolean))].sort();
    $('sType').innerHTML='<option value="">全部</option>'+types.map(t=>'<option>'+esc(t)+'</option>').join('');
    st.className='status ok'; st.textContent='已加载 '+S.list.length.toLocaleString()+' 所院校（更新于 '+(d.updated||'—')+'）';
    b.textContent='已加载'; renderSchools();
  }catch(e){ st.className='status err'; st.textContent='加载失败：'+e.message; b.disabled=false; }
}
function renderSchools(){
  if(!S.list) return;
  const kw=($('sKw').value||'').trim(), pv=$('sProv').value, ty=$('sType').value;
  let arr=S.list.filter(x=>(!kw||(x.name||'').indexOf(kw)>=0)&&(!pv||x.province===pv)&&(!ty||x.type===ty));
  arr.sort((a,b)=>(a.rank||9999)-(b.rank||9999));
  const out=$('sOut');
  if(!arr.length){ out.innerHTML='<div class="hint">没有匹配的院校。</div>'; return; }
  const show=arr.slice(0,120);
  out.innerHTML='<div class="hint">匹配 <b>'+arr.length.toLocaleString()+'</b> 所'+(arr.length>show.length?'，显示前 120 所':'')+'</div>'+
    show.map(x=>{
      const tags=[];
      if(x.is_985) tags.push('<span class="pill g">985</span>');
      if(x.is_211) tags.push('<span class="pill g">211</span>');
      if(x.double_first_class) tags.push('<span class="pill b">双一流</span>');
      if(x.is_key) tags.push('<span class="pill o">重点</span>');
      return '<div class="item"><div class="t">'+esc(x.name)+(x.rank?' <span class="pill">排名 '+esc(x.rank)+'</span>':'')+'</div>'+
        '<div class="m">'+esc([x.province,x.city,x.type,x.belong,x.level].filter(Boolean).join(' · '))+'</div>'+
        (tags.length?'<div class="m">'+tags.join('')+'</div>':'')+
        (x.baoyan_rate?'<div class="m">保研率 '+esc(x.baoyan_rate)+(x.founded?' · 创办 '+esc(x.founded):'')+(x.doctor_num?' · 博士点 '+esc(x.doctor_num):'')+(x.master_num?' · 硕士点 '+esc(x.master_num):'')+'</div>':'')+
        (x.address?'<div class="m">'+esc(x.address)+'</div>':'')+
        (x.official_site?'<div class="m"><a href="'+esc(x.official_site)+'" target="_blank" rel="noopener">官网</a></div>':'')+
      '</div>';
    }).join('');
}

async function loadMajors(){
  if(M.list){ renderMajors(); return; }

  b.disabled=true; st.className='status'; st.textContent='正在从 CDN 下载专业库（6.5 MB）…';

function syncClass(){
  const ml=$('mMenlei').value;
  const cl=[...new Set(M.list.filter(x=>!ml||x.menlei===ml).map(x=>x.class).filter(Boolean))].sort();
  $('mClass').innerHTML='<option value="">全部</option>'+cl.map(v=>'<option>'+esc(v)+'</option>').join('');
}
function renderMajors(){
  if(!M.list) return;
  const kw=($('mKw').value||'').trim(), ml=$('mMenlei').value, cl=$('mClass').value;
  const arr=M.list.filter(x=>(!kw||((x.name||'')+(x.class||'')).indexOf(kw)>=0)&&(!ml||x.menlei===ml)&&(!cl||x.class===cl));
  const out=$('mOut');

  out.innerHTML='<div class="hint">匹配 <b>'+arr.length.toLocaleString()+'</b> 个'+(arr.length>show.length?'，显示前 120 个':'')+'</div>'+

        (career?'<div class="m"><b>就业方向：</b>'+esc(career)+'</div>':'')+'</div>';

}

    const tz=KB.sh.tz||{}; let n=0, rows='';
    for(const d in tz){
      const list=(tz[d]||[]).filter(r=>!kw||(String(r[1]||'').indexOf(kw)>=0)||(d.indexOf(kw)>=0));
      if(!list.length) continue;
      n+=list.length;
      rows+='<div class="grp"><h3>'+esc(d)+'（'+list.length+'）</h3><table><thead><tr>'+
        '<th>学校</th><th>范围</th><th>类型</th><th class="num">近3年最低分</th></tr></thead><tbody>'+
        list.slice(0,40).map(r=>'<tr><td>'+esc(r[1])+'</td><td>'+esc(r[2]||'—')+'</td><td>'+esc(r[3]||'—')+
          '</td><td class="num">'+[r[5],r[7],r[9]].map(v=>v==null?'—':v).join(' / ')+'</td></tr>').join('')+
        '</tbody></table></div>';
    }
    st.className='status'; st.textContent='上海中考 · 各区统招线，共 '+n+' 条（按区分组）';
    html=rows||'<div class="hint">没有匹配的学校。</div>';
  } else if(area==='gz'){
    const arr=(KB.gz.scores||[]).filter(x=>!kw||(x.n||'').indexOf(kw)>=0);
    st.className='status'; st.textContent='广州中考 · 学校历年录取分，共 '+arr.length+' 所';
    html=arr.length?('<table><thead><tr><th>学校</th><th>批次</th><th>性质</th><th>类别</th>'+
      '<th class="num">2025</th><th class="num">2024</th><th class="num">2023</th><th class="num">2022</th></tr></thead><tbody>'+
      arr.slice(0,120).map(x=>{
        const g=y=>(x[y]&&x[y].h)?x[y].h[0]:null;
        return '<tr><td>'+esc(x.n)+'</td><td>'+esc(x.b||'—')+'</td><td>'+esc(x.na||'—')+'</td><td>'+esc(x.ca||'—')+
          '</td><td class="num">'+(g('y25')==null?'—':g('y25'))+'</td><td class="num">'+(g('y24')==null?'—':g('y24'))+
          '</td><td class="num">'+(g('y23')==null?'—':g('y23'))+'</td><td class="num">'+(g('y22')==null?'—':g('y22'))+'</td></tr>';
      }).join('')+'</tbody></table>') : '<div class="hint">没有匹配的学校。</div>';
  } else {
    const data=KB.bj.data||{}; let n=0, rows='';
    for(const d in data){
      const list=(data[d]||[]).filter(r=>!kw||(r.school||'').indexOf(kw)>=0||d.indexOf(kw)>=0);
      if(!list.length) continue;
      n+=list.length;
      rows+='<div class="grp"><h3>'+esc(d)+'（'+list.length+'）</h3><table><thead><tr><th>学校</th><th class="num">预估区排</th></tr></thead><tbody>'+
        list.map(x=>'<tr><td>'+esc(x.school)+'</td><td class="num">'+(x.district_rank_estimate||'—').toLocaleString()+'</td></tr>').join('')+
        '</tbody></table></div>';
    }
    st.className='status'; st.textContent='北京中考 · 区排对应目标高中，共 '+n+' 所';
    html=rows||'<div class="hint">没有匹配的学校。</div>';
  }
  out.innerHTML=html;
}

/* ===== 中考 · 专业（原「探专业」迁移） ===== */
function renderZkMaj(){
  const area=$('zkArea2').value, kw=($('zkMajKw').value||'').trim(), out=$('zkMajOut'), st=$('zkMajStat');
  if(area==='sh'){
    const arr=(KB.sh.zb||[]).filter(r=>!kw||((r[0]||'')+(r[7]||'')+(r[2]||'')).indexOf(kw)>=0);
    st.className='status'; st.textContent='上海中本贯通 · 共 '+arr.length+' 个专业';
    out.innerHTML=arr.length?('<table><thead><tr><th>中职校</th><th>专业</th><th>对接本科</th>'+
      '<th class="num">计划</th><th class="num">25线</th><th class="num">24线</th><th class="num">23线</th></tr></thead><tbody>'+
      arr.slice(0,150).map(r=>'<tr><td>'+esc(r[0])+'</td><td>'+esc(r[7])+'</td><td>'+esc(r[2])+
        '</td><td class="num">'+(r[3]==null?'—':r[3])+'</td><td class="num">'+(r[4]==null?'—':r[4])+
        '</td><td class="num">'+(r[5]==null?'—':r[5])+'</td><td class="num">'+(r[6]==null?'—':r[6])+'</td></tr>').join('')+
      '</tbody></table>') : '<div class="hint">没有匹配的专业。</div>';
    if(arr.length) out.innerHTML+='<div class="hint" style="margin-top:10px">中本贯通＝中职 3 年 + 本科 4 年，2 个平行志愿、分数够即录；录取后锁档，不再参与后续普高录取。</div>';
  } else {
    const arr=(KB.gzMaj.zz1||[]).filter(r=>!kw||((r.sch||'')+(r.major||'')+(r.jiedui||'')).indexOf(kw)>=0);
    st.className='status'; st.textContent='广州贯通 / 中职专业 · 共 '+arr.length+' 条';
    out.innerHTML=arr.length?('<table><thead><tr><th>学校</th><th>专业</th><th>类别</th><th>对接院校</th>'+
      '<th class="num">计划</th><th class="num">学费</th></tr></thead><tbody>'+
      arr.slice(0,150).map(r=>'<tr><td>'+esc(r.sch)+'</td><td>'+esc(r.major)+'</td><td>'+esc(r.type||'—')+
        '</td><td>'+esc(r.jiedui||'—')+'</td><td class="num">'+(r.plan==null?'—':r.plan)+'</td><td class="num">'+(r.fee==null?'—':r.fee)+'</td></tr>').join('')+
      '</tbody></table>') : '<div class="hint">没有匹配的专业。</div>';
  }
}

$('sProv').addEventListener('change',()=>{ if(S.list) renderSchools(); });
$('sType').addEventListener('change',()=>{ if(S.list) renderSchools(); });
$('sKw').addEventListener('input',()=>{ if(S.list) renderSchools(); });
$('mMenlei').addEventListener('change',()=>{ if(M.list){ syncClass(); renderMajors(); } });
$('mClass').addEventListener('change',()=>{ if(M.list) renderMajors(); });
$('mKw').addEventListener('input',()=>{ if(M.list) renderMajors(); });
</script>
